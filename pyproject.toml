[project]
name = "oss-notifier-agent"
version = "0.1.0"
description = "LLM-triaged good-first-issue digest for GitHub repos, delivered by email."
license = "BSD-3-Clause"
requires-python = ">=3.13"
authors = [{ name = "Thorin Tabor" }]
dependencies = [
    "pydantic-ai>=2.1.0",
    "pydantic-settings>=2.0",
    "logfire>=3.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/tmtabor/oss-notifier-agent"
Repository = "https://github.com/tmtabor/oss-notifier-agent"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pydantic-evals>=2.1.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "eval: marks tests as evals (require an API key; run with -m eval, skipped by default)",
]
addopts = "-m 'not eval'"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["agent"]
